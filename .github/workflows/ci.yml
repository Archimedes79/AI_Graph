name: CI

# The fast gate: the same checks `checkpoint.py --verify-only` runs locally, on
# every push and pull request. The executable is built by release.yml instead,
# because a Windows build is minutes rather than seconds and is only interesting
# for something you intend to hand to someone.

on:
  # Every branch, not just main: in a repo where most work lands as a direct
  # push, restricting this to main would test changes only after they are
  # already in the branch you would have to revert.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # pytest/pytest-asyncio are test-only and deliberately absent from
      # requirements.txt, which is what a deploy bundle installs.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install engine dependencies
        run: npm install
        working-directory: engine

      # First, like checkpoint.py: a stale graph.generated.ts makes the
      # frontend fail in a way that looks unrelated to the real cause.
      - name: Generated types are current
        run: npm run gen:types:check
        working-directory: frontend

      # `npm run test` is vitest, which does not type-check: for a while a push
      # could be green while `npm run build` was broken, and the first anyone
      # heard of it was at release time.
      - name: Frontend types
        run: npm run typecheck
        working-directory: frontend

      - name: Backend tests
        run: python -m pytest tests -q
        working-directory: backend

      - name: Frontend tests
        run: npm run test
        working-directory: frontend

      # The engine's suite runs the example graphs through both engines and
      # diffs them, so it needs Python and Node together — which is why it is a
      # step of the shared gate rather than of either half.
      - name: Engine types
        run: npm run typecheck
        working-directory: engine

      - name: Engine tests
        run: npm run test
        working-directory: engine
        env:
          AI_GRAPH_PYTHON: python
