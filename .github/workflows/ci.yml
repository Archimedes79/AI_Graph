name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine is TypeScript that Node runs unbuilt, so the Node here is
      # the Node a recipient needs: 24 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # One workspace, one lockfile: the engine and the editor share it.
      - name: Install
        run: npm ci

      # `npm test` is vitest, which does not type-check: for a while a push
      # could be green while `npm run build` was broken, and the first anyone
      # heard of it was at release time.
      - name: Types
        run: npm run typecheck

      # Before the tests: the bundle test asserts that a bundle carries the
      # built page, so the page has to exist by then -- and a checkout that
      # cannot build has no page to carry.
      - name: Build the editor
        run: npm run build

      - name: Tests
        run: npm test

  # The download for people who do not want a container: one zip holding the
  # engine's source, the built page and the examples. The engine has no runtime
  # dependencies and Node runs its TypeScript unbuilt, so a recipient unzips it
  # and runs it -- no npm install, no build step, no Docker.
  #
  # On a vX.Y.Z tag only: a release is a thing people link to, so it gets a
  # version rather than moving under them.
  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the editor
        run: npm run build

      - name: Package
        run: node scripts/package.mjs "ai-graph-${{ github.ref_name }}.zip"

      # `gh` is on the runner already, so the release needs no third-party
      # action and no token beyond the one this job is given.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "ai-graph-${{ github.ref_name }}.zip" \
            --title "AI-Graph ${{ github.ref_name }}" \
            --generate-notes

  # Publishes the same one-process image docs/install.md and docker-compose.yml
  # describe -- built here, not by hand, so what a `docker pull` gets is what
  # this run just tested. Skipped for a pull request: nobody should be able to
  # publish an image by opening one.
  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `main` -> the `latest` tag; a `vX.Y.Z` push additionally tags that
      # version and its `X.Y` / `X` shorthands, the way most images on this
      # registry are tagged.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
