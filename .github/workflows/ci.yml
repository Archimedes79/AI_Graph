name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine is TypeScript that Node runs unbuilt, so the Node here is
      # the Node a recipient needs: 24 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # One workspace, one lockfile: the engine and the editor share it.
      - name: Install
        run: npm ci

      # `npm test` is vitest, which does not type-check: for a while a push
      # could be green while `npm run build` was broken, and the first anyone
      # heard of it was at release time.
      - name: Types
        run: npm run typecheck

      # Before the tests: the bundle test asserts that a bundle carries the
      # built page, so the page has to exist by then -- and a checkout that
      # cannot build has no page to carry.
      - name: Build the editor
        run: npm run build

      - name: Tests
        run: npm test
