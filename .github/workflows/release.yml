name: Build executable

# Builds the standalone editor executable, then tests THAT ARTIFACT rather than
# the source it came from: a separate job downloads it the way a user would and
# drives it over HTTP. On a tag, the tested artifact is attached to a release.
#
# Not run on every push: a Windows build takes minutes where the CI suite takes
# seconds, and an executable is only interesting once you mean to hand it to
# someone. Use "Run workflow" to build one on demand from any branch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release job's upload

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Builds frontend/dist first, then freezes it into the executable.
      # --embed-python ships an interpreter inside it: whoever downloads this is
      # unlikely to have Python installed, and without one their code nodes
      # cannot run at all. It costs ~15 MB of download and makes the standalone
      # smoke job below able to prove the claim instead of skipping it.
      - name: Build executable
        run: python build_editor_exe.py --embed-python

      - uses: actions/upload-artifact@v4
        with:
          name: ai-graph-windows
          path: dist/ai-graph.exe
          if-no-files-found: error
          retention-days: 90

  smoke:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # full:       everything, including a Python code node (which shells out
        #             to the runner's Python, exactly as it would on a user's box)
        # standalone: PATH cut back until no interpreter is reachable, so both
        #             claims are tested at once -- that the editor boots on its
        #             own embedded runtime, and that code nodes run on the Python
        #             the build ships rather than on the machine's
        mode: [full, standalone]
    steps:
      # The repo is needed for examples/ and for the byte-identical comparison
      # between a bundle the exe exports and this checkout's sources.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: ai-graph-windows
          path: dist

      - name: Smoke-test the executable (${{ matrix.mode }})
        run: >
          python smoke_test_exe.py dist/ai-graph.exe
          ${{ matrix.mode == 'standalone' && '--standalone' || '' }}

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-graph-windows
          path: dist

      - name: Attach the tested executable to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-graph.exe
          generate_release_notes: true
